name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: ruff
        run: uvx ruff check .
      - name: mypy
        run: uv run mypy

  # Three compilers across three standard libraries. Clang pairs with libc++
  # rather than libstdc++ because libstdc++'s <expected> is incompatible with
  # Clang's concepts front end; libstdc++ itself is still covered by the GCC job.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (libstdc++)
            os: ubuntu-24.04
            cxx: g++
          - name: Linux Clang (libc++)
            os: ubuntu-24.04
            cxx: clang++-18
            llvm: "18"
            cmakeflags: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          - name: Windows MSVC
            os: windows-2022
            cxx: cl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.llvm }} + libc++
        if: matrix.llvm
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y -q libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.cmakeflags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
