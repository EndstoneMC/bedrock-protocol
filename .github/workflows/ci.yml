name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --no-install-project --extra compiler
      - name: ruff
        run: uvx ruff check .
      - name: Generate Python stubs
        run: |
          uv run --no-sync python -m bedrock_protocol --language nanobind --out build/python --import-path . protocol/[!_]*.py
          cp build/python/bedrock_protocol/*.pyi src/bedrock_protocol/
        env:
          PYTHONPATH: src
      - name: mypy
        run: uv run --no-sync mypy
        env:
          MYPYPATH: src

  test:
    name: Compiler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --no-install-project --extra compiler
      - name: pytest
        run: uv run --no-sync pytest tests/compiler -n auto
        env:
          PYTHONPATH: src

  delivery:
    name: Python and wire (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - name: Set up Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $clangBin = Join-Path $vs 'VC\Tools\Llvm\x64\bin'
          $clang = Join-Path $clangBin 'clang-cl.exe'
          if (-not (Test-Path -LiteralPath $clang)) { throw "clang-cl is missing: $clang" }
          $clangBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $clang --version
      - name: Install build tools and create a private profile
        run: |
          export CONAN_HOME="$RUNNER_TEMP/delivery-conan"
          echo "CONAN_HOME=$CONAN_HOME" >> "$GITHUB_ENV"
          python -m pip install build hatchling conan-py-build==0.6.4 click griffe pytest nanobind==3.1.0
          mkdir -p "$CONAN_HOME/profiles"
          if [ "$RUNNER_OS" = Windows ]; then
            cp cmake/conan/windows-clang.profile "$CONAN_HOME/profiles/delivery"
          else
            gcc_major="$(g++ -dumpfullversion | cut -d. -f1)"
            cat > "$CONAN_HOME/profiles/delivery" <<EOF
          [settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=$gcc_major
          compiler.cppstd=gnu23
          compiler.libcxx=libstdc++11
          build_type=Release
          [conf]
          tools.cmake.cmaketoolchain:generator=Ninja
          tools.build:compiler_executables={"c":"gcc","cpp":"g++"}
          tools.build:jobs=2
          EOF
          fi
      - name: Build pure compiler and native source distributions
        run: |
          python -m build --outdir "$RUNNER_TEMP/delivery-pure"
          python scripts/stage_native.py . "$RUNNER_TEMP/delivery-native-source"
          python -m build --sdist "$RUNNER_TEMP/delivery-native-source" --outdir "$RUNNER_TEMP/delivery-dist"
          mkdir "$RUNNER_TEMP/delivery-sdist"
          python -m tarfile -e "$RUNNER_TEMP"/delivery-dist/*.tar.gz "$RUNNER_TEMP/delivery-sdist" --filter data
      - name: Run generated native regressions
        run: |
          fixture_args=()
          if [ "$RUNNER_OS" = Windows ]; then
            fixture_args+=(--cmake-arg=-DCMAKE_CXX_COMPILER=clang-cl)
          fi
          python "$RUNNER_TEMP"/delivery-sdist/*/tests/compiler/native/run.py \
            --work-dir "$RUNNER_TEMP/delivery-native-fixture" "${fixture_args[@]}"
      - name: Build wheel from sdist
        run: |
          python -m build --wheel "$RUNNER_TEMP"/delivery-sdist/* --outdir "$RUNNER_TEMP/delivery-dist" \
            -C host-profile=delivery -C build-profile=delivery -C "build-dir=$RUNNER_TEMP/delivery-wheel-build"
      - name: Test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/delivery-consumer"
          if [ "$RUNNER_OS" = Windows ]; then
            consumer="$RUNNER_TEMP/delivery-consumer/Scripts/python.exe"
          else
            consumer="$RUNNER_TEMP/delivery-consumer/bin/python"
          fi
          wheels=("$RUNNER_TEMP"/delivery-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$consumer" -m pip install "$RUNNER_TEMP"/delivery-pure/*.whl
          "$consumer" -I -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('conan', 'nanobind', 'bedrock_protocol._native'))"
          "$consumer" -I "$GITHUB_WORKSPACE/tests/package/check_delivery.py" compiler "$GITHUB_WORKSPACE/protocol/__init__.py" "$RUNNER_TEMP/delivery-bpc-pure"
          "$consumer" -m pip install pytest "${wheels[0]}"
          "$consumer" -I "$GITHUB_WORKSPACE/tests/package/check_delivery.py" payloads
          mkdir "$RUNNER_TEMP/delivery-consumer-tests"
          cp -r "$GITHUB_WORKSPACE/tests" "$RUNNER_TEMP/delivery-consumer-tests/"
          cd "$RUNNER_TEMP/delivery-consumer-tests"
          "$consumer" -I "$GITHUB_WORKSPACE/tests/package/check_delivery.py" installed "$GITHUB_WORKSPACE/protocol/__init__.py"
          "$consumer" -I "$GITHUB_WORKSPACE/tests/package/check_delivery.py" compiler "$GITHUB_WORKSPACE/protocol/__init__.py" "$RUNNER_TEMP/delivery-bpc"
          "$consumer" -I -W error -m pytest tests/python
          "$consumer" -m pip uninstall -y bedrock-protocol-native
          "$consumer" -I "$GITHUB_WORKSPACE/tests/package/check_delivery.py" compiler "$GITHUB_WORKSPACE/protocol/__init__.py" "$RUNNER_TEMP/delivery-bpc-after-uninstall"
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: python-pure
          path: ${{ runner.temp }}/delivery-pure/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-native-${{ runner.os }}
          path: ${{ runner.temp }}/delivery-dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: python-native-source
          path: ${{ runner.temp }}/delivery-dist/*.tar.gz
          if-no-files-found: error
      - name: Build and run the independent wire golden
        run: |
          conan install "$GITHUB_WORKSPACE" --output-folder "$RUNNER_TEMP/delivery-wire" \
            --profile:host delivery --profile:build delivery --build=missing \
            '-o=&:with_wire=True' '-o=&:with_tests=True'
          cmake -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/delivery-wire/build/Release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/delivery-wire/build/Release/generators/conan_toolchain.cmake"
          cmake --build "$RUNNER_TEMP/delivery-wire/build/Release" --target bedrock_protocol bedrock_protocol_wire_tests
          ctest --test-dir "$RUNNER_TEMP/delivery-wire/build/Release" -R '^bedrock_protocol_wire_tests$' --no-tests=error --output-on-failure
      - name: Consume the installed wire target
        run: |
          cmake --install "$RUNNER_TEMP/delivery-wire/build/Release" --prefix "$RUNNER_TEMP/delivery-wire-stage"
          cmake -S "$GITHUB_WORKSPACE/tests/package" -B "$RUNNER_TEMP/delivery-wire-consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/delivery-wire/build/Release/generators/conan_toolchain.cmake" \
            -Dbedrock-protocol_DIR="$RUNNER_TEMP/delivery-wire-stage/lib/cmake/bedrock-protocol"
          cmake --build "$RUNNER_TEMP/delivery-wire-consumer"
          ctest --test-dir "$RUNNER_TEMP/delivery-wire-consumer" -R '^package_wire_test$' --no-tests=error --output-on-failure

  # Three compilers across three standard libraries. Clang pairs with libc++
  # rather than libstdc++ because libstdc++'s <expected> is incompatible with
  # Clang's concepts front end; libstdc++ itself is still covered by the GCC job.
  #
  # Each job also uploads its install tree. A static library carries its standard
  # library's ABI, so the triple in the artifact name is part of the contract: a
  # libstdc++ build and a libc++ build are not interchangeable.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (libstdc++)
            os: ubuntu-24.04
            triple: linux-x86_64-gcc13
            cxx: g++
          - name: Linux Clang (libc++)
            os: ubuntu-24.04
            triple: linux-x86_64-clang18-libcxx
            cxx: clang++-18
            llvm: "18"
            cmakeflags: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          - name: Windows MSVC
            os: windows-2022
            triple: windows-x86_64-msvc2022
            cxx: cl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.llvm }} + libc++
        if: matrix.llvm
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y -q libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - run: uv sync --no-install-project --extra compiler
      - name: Configure
        run: uv run --no-sync cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage ${{ matrix.cmakeflags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      # The install tree has to stand on its own: a consumer resolves it through
      # find_package, includes the umbrella and links the archive, with no part of
      # the build tree and no Python in sight.
      - name: Consume the install tree
        shell: bash
        run: |
          cmake -S tests/package -B package-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_PREFIX_PATH='${{ github.workspace }}/stage' \
                ${{ matrix.cmakeflags }}
          cmake --build package-build
          ctest --test-dir package-build --output-on-failure

      - name: Name the package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^project(bedrock-protocol VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "name=bedrock-protocol-${version}-${GITHUB_SHA::7}-${{ matrix.triple }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/
          if-no-files-found: error

  # The C++ the compiler emits, shipped next to the hand-written runtime. Building
  # from this package needs neither uv nor bpc, which is what the last step checks.
  sources:
    name: Source package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - uses: lukka/get-cmake@latest

      - name: Generate
        run: |
          uv sync --no-install-project --extra compiler
          uv run --no-sync cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBEDROCK_PROTOCOL_BUILD_TESTS=OFF
          cmake --build build

      - name: Stage
        id: package
        run: |
          version=$(sed -n 's/^project(bedrock-protocol VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name=bedrock-protocol-${version}-${GITHUB_SHA::7}-src
          mkdir -p "stage/$name/cmake"
          cp CMakeLists.txt LICENSE README.md "stage/$name/"
          cp cmake/bedrock-protocol-config.cmake.in "stage/$name/cmake/"
          cp -r include "stage/$name/include"
          cp -r build/generated "stage/$name/generated"
          rm "stage/$name/include/bedrock/protocol.hpp.in"
          rm "stage/$name/include/bedrock/protocol/version.hpp.in"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      # No uv on PATH: were a generated file missing from the package, the configure
      # would fall through to bpc and fail here rather than in a consumer.
      - name: Build it without the compiler
        run: |
          for tool in uv uvx; do
            path=$(command -v $tool || true)
            [ -n "$path" ] && sudo mv "$path" "$path.disabled"
          done
          cmake -S stage/${{ steps.package.outputs.name }} -B verify -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/verify-stage
          cmake --build verify
          cmake --install verify
          cmake -S tests/package -B verify-package -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=${{ github.workspace }}/verify-stage
          cmake --build verify-package
          ctest --test-dir verify-package --output-on-failure
