name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - name: ruff
        run: uvx ruff check .
      - name: mypy
        run: uv run mypy

  test:
    name: Compiler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - name: pytest
        run: uv run pytest -n auto

  delivery:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - name: Set up Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Install build tools and create a private profile
        run: |
          export CONAN_HOME="$RUNNER_TEMP/delivery-conan"
          echo "CONAN_HOME=$CONAN_HOME" >> "$GITHUB_ENV"
          python -m pip install build conan-py-build==0.6.4
          mkdir -p "$CONAN_HOME/profiles"
          if [ "$RUNNER_OS" = Windows ]; then
            cp cmake/conan/windows-msvc.profile "$CONAN_HOME/profiles/delivery"
          else
            gcc_major="$(g++ -dumpfullversion | cut -d. -f1)"
            cat > "$CONAN_HOME/profiles/delivery" <<EOF
          [settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=$gcc_major
          compiler.cppstd=gnu23
          compiler.libcxx=libstdc++11
          build_type=Release
          [conf]
          tools.cmake.cmaketoolchain:generator=Ninja
          tools.build:compiler_executables={"c":"gcc","cpp":"g++"}
          tools.build:jobs=2
          EOF
          fi
      - name: Build the compiler wheel and the runtime source distribution
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/delivery-pure"
          python scripts/stage_native.py . "$RUNNER_TEMP/delivery-native-source"
          python -m build --sdist "$RUNNER_TEMP/delivery-native-source" --outdir "$RUNNER_TEMP/delivery-dist"
          mkdir "$RUNNER_TEMP/delivery-sdist"
          python -m tarfile -e "$RUNNER_TEMP"/delivery-dist/*.tar.gz "$RUNNER_TEMP/delivery-sdist" --filter data
      - name: Build the runtime wheel from its sdist
        run: |
          python -m build --wheel "$RUNNER_TEMP"/delivery-sdist/* --outdir "$RUNNER_TEMP/delivery-dist" \
            -C host-profile=delivery -C build-profile=delivery -C "build-dir=$RUNNER_TEMP/delivery-wheel-build"
      - name: Test the installed wheels outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/delivery-consumer"
          if [ "$RUNNER_OS" = Windows ]; then
            consumer="$RUNNER_TEMP/delivery-consumer/Scripts/python.exe"
          else
            consumer="$RUNNER_TEMP/delivery-consumer/bin/python"
          fi
          wheels=("$RUNNER_TEMP"/delivery-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          case "${wheels[0]}" in *-cp312-abi3-*) ;; *) echo "not an abi3 wheel: ${wheels[0]}"; exit 1 ;; esac
          "$consumer" -m pip install pytest "${wheels[0]}"
          "$consumer" -I -c "import importlib.util as u; assert u.find_spec('bedrock_protocol_compiler') is None"
          "$consumer" -I -c "import bedrock_protocol as bp; assert bp.TextPacket is getattr(bp, f'v{bp.LATEST_PROTOCOL}').TextPacket"
          mkdir "$RUNNER_TEMP/delivery-consumer-tests"
          cp -r "$GITHUB_WORKSPACE/tests" "$RUNNER_TEMP/delivery-consumer-tests/"
          cd "$RUNNER_TEMP/delivery-consumer-tests"
          "$consumer" -I -m pytest tests --ignore=tests/compiler
          "$consumer" -m pip install "$RUNNER_TEMP"/delivery-pure/*.whl
          "$consumer" -I -m bedrock_protocol_compiler --language cpp --out "$RUNNER_TEMP/delivery-bpc" \
            --import-path "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/protocol/block.py" "$GITHUB_WORKSPACE/protocol/nbt.py"
          test -f "$RUNNER_TEMP/delivery-bpc/block.h"
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: python-compiler
          path: ${{ runner.temp }}/delivery-pure/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-runtime-${{ runner.os }}
          path: ${{ runner.temp }}/delivery-dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: python-runtime-source
          path: ${{ runner.temp }}/delivery-dist/*.tar.gz
          if-no-files-found: error

  # Three compilers across three standard libraries. Clang pairs with libc++
  # rather than libstdc++ because libstdc++'s <expected> is incompatible with
  # Clang's concepts front end; libstdc++ itself is still covered by the GCC job.
  #
  # Each job also uploads its install tree. A static library carries its standard
  # library's ABI, so the triple in the artifact name is part of the contract: a
  # libstdc++ build and a libc++ build are not interchangeable.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (libstdc++)
            os: ubuntu-24.04
            triple: linux-x86_64-gcc13
            cxx: g++
          - name: Linux Clang (libc++)
            os: ubuntu-24.04
            triple: linux-x86_64-clang18-libcxx
            cxx: clang++-18
            llvm: "18"
            cmakeflags: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          - name: Windows MSVC
            os: windows-2022
            triple: windows-x86_64-msvc2022
            cxx: cl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.llvm }} + libc++
        if: matrix.llvm
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y -q libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage ${{ matrix.cmakeflags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      # The install tree has to stand on its own: a consumer resolves it through
      # find_package, includes the umbrella and links the archive, with no part of
      # the build tree and no Python in sight.
      - name: Consume the install tree
        shell: bash
        run: |
          cmake -S tests/package -B package-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_PREFIX_PATH='${{ github.workspace }}/stage' \
                ${{ matrix.cmakeflags }}
          cmake --build package-build
          ctest --test-dir package-build --output-on-failure

      - name: Name the package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^project(bedrock-protocol VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "name=bedrock-protocol-${version}-${GITHUB_SHA::7}-${{ matrix.triple }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/
          if-no-files-found: error

  # The C++ the compiler emits, shipped next to the hand-written runtime. Building
  # from this package needs neither uv nor bpc, which is what the last step checks.
  sources:
    name: Source package
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - uses: lukka/get-cmake@latest

      - name: Generate
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBEDROCK_PROTOCOL_BUILD_TESTS=OFF
          cmake --build build

      - name: Stage
        id: package
        run: |
          version=$(sed -n 's/^project(bedrock-protocol VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name=bedrock-protocol-${version}-${GITHUB_SHA::7}-src
          mkdir -p "stage/$name/cmake"
          cp CMakeLists.txt LICENSE README.md "stage/$name/"
          cp cmake/bedrock-protocol-config.cmake.in "stage/$name/cmake/"
          cp -r include "stage/$name/include"
          cp -r build/generated "stage/$name/generated"
          rm "stage/$name/include/bedrock/protocol.hpp.in"
          rm "stage/$name/include/bedrock/protocol/version.hpp.in"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      # No uv on PATH: were a generated file missing from the package, the configure
      # would fall through to bpc and fail here rather than in a consumer.
      - name: Build it without the compiler
        run: |
          for tool in uv uvx; do
            path=$(command -v $tool || true)
            [ -n "$path" ] && sudo mv "$path" "$path.disabled"
          done
          cmake -S stage/${{ steps.package.outputs.name }} -B verify -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/verify-stage
          cmake --build verify
          cmake --install verify
          cmake -S tests/package -B verify-package -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=${{ github.workspace }}/verify-stage
          cmake --build verify-package
          ctest --test-dir verify-package --output-on-failure

  python-from-sources:
    name: Python from the source package
    needs: sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.sources.outputs.name }}
          path: package
      - name: Build the binding from the generated sources
        run: |
          for tool in uv uvx; do
            path=$(command -v $tool || true)
            [ -n "$path" ] && sudo mv "$path" "$path.disabled"
          done
          rm -rf protocol src/bedrock_protocol_compiler
          cp -r package/generated generated
          python -m pip install nanobind==2.13.0 pytest
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBEDROCK_PROTOCOL_BUILD_TESTS=OFF \
                -DBEDROCK_PROTOCOL_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build
          cmake --install build --prefix stage --component bedrock_protocol_wheel
      - name: Test it
        run: PYTHONPATH=stage python -m pytest tests --ignore=tests/compiler
