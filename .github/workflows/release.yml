name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag against the project version
        run: |
          version=$(sed -n 's/^project(bedrock-protocol VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}"
            exit 1
          fi

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Collect the assets
        run: |
          shopt -s nullglob
          dirs=(artifacts/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::the build produced no artifacts to release"
            exit 1
          fi
          mkdir -p assets
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            if [[ "$name" == *.whl || "$name" == *.tar.gz ]]; then
              cp "$dir/$name" assets/
              continue
            fi
            (cd artifacts && zip -qr "../assets/${name}.zip" "$name")
          done
          ls -l assets

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job downloads artifacts and never checks out, so gh has no git
          # remote to read the repository off.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            assets/*

  pypi:
    name: PyPI
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bedrock-protocol/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bedrock_protocol-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.3
