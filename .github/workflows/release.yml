name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the project version
        run: |
          for file in pyproject.toml compiler/pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$file")
            if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ${file} version ${version}"
              exit 1
            fi
          done

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the assets after the release
        run: |
          shopt -s nullglob
          dirs=(artifacts/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::the build produced no artifacts to release"
            exit 1
          fi
          mkdir -p assets
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            if [[ "$name" == python-* ]]; then
              cp "$dir"/* assets/
              continue
            fi
            asset=${name/-${GITHUB_SHA::7}/}
            mv "artifacts/$name" "artifacts/$asset"
            (cd artifacts && zip -qr "../assets/${asset}.zip" "$asset")
          done
          ls -l assets

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job downloads artifacts and never checks out, so gh has no git
          # remote to read the repository off.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            assets/*
