[project]
name = "bedrock-protocol"
version = "0.5.0.dev0"
description = "Bedrock packets and codecs for Python, bound from the generated C++."
requires-python = ">=3.12"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "python/NOTICE"]

[build-system]
requires = ["conan-py-build==0.6.4", "nanobind==2.13.0", "click", "griffe"]
build-backend = "conan_py_build.build"

[tool.conan-py-build]
extra-profile = "python.profile"
extra-arguments = ["-o=&:with_python=True", "-o=&:with_tests=False"]

[tool.conan-py-build.wheel]
packages = []

[tool.conan-py-build.sdist]
include = ["compiler/src", "compiler/pyproject.toml", "python", "protocol", "tests", "third_party", "conanfile.py", "python.profile"]
exclude = ["__pycache__", "*.pyc", "*.pyd", "*.so", "*.dll", "*.dylib"]

[tool.uv.workspace]
members = ["compiler"]
