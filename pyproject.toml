[project]
name = "bedrock-protocol-compiler"
version = "0.5.0.dev0"
description = "The Bedrock protocol schema and bpc, the compiler that emits its C++ codecs."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["click", "griffe"]

[project.scripts]
bpc = "bedrock_protocol_compiler.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_protocol_compiler"]

[tool.hatch.build.targets.sdist]
include = ["src/bedrock_protocol_compiler", "protocol", "tests/compiler", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/compiler"]

[tool.mypy]
packages = ["bedrock_protocol_compiler"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 120
lint.select = ["I", "E", "F"]

[tool.ruff.lint.isort]
known-first-party = ["bedrock_protocol", "bedrock_protocol_compiler"]

[tool.ruff.lint.per-file-ignores]
"protocol/*.py" = ["F811", "F821"]
