[project]
name = "bedrock-protocol"
version = "0.5.0.dev0"
description = "Version-aware Bedrock protocol schema compiler."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["click", "griffe"]

[project.optional-dependencies]
compiler = []

[project.scripts]
bpc = "bedrock_protocol.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["__pycache__", "*.pyc", "*.pyd", "*.so", "*.dll", "*.dylib", "src/bedrock_protocol/v[0-9]*.py", "src/bedrock_protocol/v[0-9]*.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_protocol"]

[tool.hatch.build.targets.sdist]
include = ["src/bedrock_protocol", "protocol", "tests/compiler", "LICENSE", "README.md", "pyproject.toml"]

[tool.mypy]
packages = ["bedrock_protocol"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 120
lint.select = ["I", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"protocol/*.py" = ["F811", "F821"]
