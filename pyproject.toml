[project]
name = "bedrock-protocol"
version = "0.5.0.dev0"
description = "Bedrock packets and codecs for Python, bound from the generated C++."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = ["nanobind==2.13.0", "pytest", "scikit-build-core>=1.1"]

[build-system]
requires = ["scikit-build-core>=1.1", "nanobind==2.13.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{build_type}"
cmake.args = ["-GNinja"]
wheel.py-api = "cp312"
sdist.inclusion-mode = "explicit"
sdist.include = ["/pyproject.toml", "/CMakeLists.txt", "/LICENSE", "/README.md", "/cmake/", "/include/", "/protocol/*.py", "/compiler/pyproject.toml", "/compiler/src/", "/python/", "/tests/*.py", "/tests/goldens/"]
sdist.exclude = ["__pycache__/"]

[tool.uv]
no-build-isolation-package = ["bedrock-protocol"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "include/**" },
    { file = "python/*" },
    { file = "protocol/*.py" },
    { file = "compiler/src/**/*.py" },
]

[tool.uv.workspace]
members = ["compiler"]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
archs = ["auto64"]
test-requires = ["pytest", "mypy"]
test-command = [
    "python -I -c \"import importlib.util as u; assert u.find_spec('bedrock_protocol_compiler') is None\"",
    "pytest {project}/tests",
    "mypy --strict --config-file {project}/pyproject.toml -p bedrock_protocol",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 120
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PT", "PIE", "ERA", "T20", "ARG", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["bedrock_protocol", "bedrock_protocol_compiler"]

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
"protocol/__init__.py" = ["F401"]
"protocol/**" = ["E501", "F811", "F821", "N", "ARG", "UP007", "PIE794", "PIE796", "RUF036"]
"**/bench_*.py" = ["T20"]
"compiler/src/bedrock_protocol_compiler/builder.py" = ["B023"]
"compiler/src/bedrock_protocol_compiler/cpp/field.py" = ["ARG002"]
"compiler/src/bedrock_protocol_compiler/dsl.py" = ["ARG001", "ARG002", "N801"]

"tests/cereal.py" = ["ARG002"]
[tool.mypy]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["nanobind.*"]
follow_untyped_imports = true
