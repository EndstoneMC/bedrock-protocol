[project]
name = "bedrock-protocol"
version = "0.5.0.dev0"
description = "Bedrock packets and codecs for Python, bound from the generated C++."
requires-python = ">=3.12"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "python/NOTICE"]

[dependency-groups]
dev = ["nanobind==2.13.0", "pytest", "scikit-build-core>=1.1"]

[build-system]
requires = ["scikit-build-core>=1.1", "nanobind==2.13.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
sdist.inclusion-mode = "explicit"
sdist.include = ["/pyproject.toml", "/CMakeLists.txt", "/LICENSE", "/cmake/", "/include/", "/protocol/*.py", "/compiler/pyproject.toml", "/compiler/src/", "/python/"]
sdist.exclude = ["__pycache__/"]

[tool.uv]
no-build-isolation-package = ["bedrock-protocol"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "include/**" },
    { file = "python/*" },
    { file = "protocol/*.py" },
    { file = "compiler/src/**/*.py" },
]

[tool.uv.workspace]
members = ["compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
