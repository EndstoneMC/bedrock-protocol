[project]
name = "bedrock-protocol"
version = "0.1.0"
description = "Bedrock protocol compiler -- reads protocol/*.py DSL and emits C++ headers."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click",
    "griffe",
]

[project.scripts]
bpc = "bedrock_protocol.cli:main"

[dependency-groups]
dev = ["mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_protocol"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 120
lint.select = ["I", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"protocol/*.py" = ["F811", "F821"]
